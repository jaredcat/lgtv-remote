# Pure flake evals only see git. On tag push, write ./VERSION from the tag,
# move the tag to that commit, and push VERSION to main so
# `nix flake update` against github:jaredcat/lgtv-remote gets the release number.
# Do not edit VERSION by hand. Cargo.toml stays 0.0.0 for CI stamping.
#
# Pushing to protected main requires secrets.VERSION_SYNC_TOKEN: a classic or
# fine-grained PAT from a repo admin (admins are on the main ruleset bypass
# list). The built-in GITHUB_TOKEN cannot bypass "require a pull request" on
# personal repositories.
name: Ensure release version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ensure-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync VERSION to tag and main
        env:
          VERSION_SYNC_TOKEN: ${{ secrets.VERSION_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ "$CURRENT" != "$VERSION" ]; then
            printf '%s\n' "$VERSION" > VERSION
            git add VERSION
            git commit -m "Release ${VERSION}"
            git tag -f "$TAG"
            git push origin "refs/tags/${TAG}" --force
            echo "Moved ${TAG} to $(git rev-parse HEAD)"
          else
            echo "Tag ${TAG} already has VERSION ${VERSION}"
          fi

          git fetch origin main
          git checkout -B version-sync origin/main
          MAIN_VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ "$MAIN_VERSION" = "$VERSION" ]; then
            echo "main already has VERSION ${VERSION}"
            exit 0
          fi

          if [ -z "${VERSION_SYNC_TOKEN}" ]; then
            echo "::error::Add repository secret VERSION_SYNC_TOKEN (admin PAT with Contents: Read and write) so this workflow can push to protected main."
            exit 1
          fi

          printf '%s\n' "$VERSION" > VERSION
          git add VERSION
          git commit -m "Release ${VERSION}"
          git remote set-url origin "https://x-access-token:${VERSION_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/main
          echo "Updated VERSION on main to ${VERSION}"
