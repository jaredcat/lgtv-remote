name: Build Tray App

on:
  workflow_call:
    inputs:
      version:
        description: "Version string (e.g., v1.0.0)"
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            name: linux
          - platform: windows-latest
            args: ""
            name: windows
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-targets: true

      - name: Update version in Tauri config
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/version = \"[^\"]*\";/version = \"$VERSION\";/" flake.nix
          rm -f src-tauri/Cargo.toml.bak src-tauri/tauri.conf.json.bak flake.nix.bak

      - name: Install 1Password CLI
        if: matrix.platform == 'macos-latest'
        uses: 1password/install-cli-action@v4

      - name: Load macOS signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/lgtv-codesign.p12"
          keychain="$RUNNER_TEMP/lgtv.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          op read --out-file "$p12" "op://lgtv-remote/lgtv-tray-remote-dev/p12"
          p12_password="$(op read "op://lgtv-remote/lgtv-tray-remote-dev/password")"
          p12_password="${p12_password%$'\n'}"
          echo "::add-mask::$p12_password"
          echo "::add-mask::$keychain_password"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$p12_password" -f pkcs12 -T /usr/bin/codesign -A
          # Do not call `security add-trusted-cert` here. On a GitHub runner it
          # waits forever for an admin dialog. codesign does not need that trust
          # to apply this identity.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

          # Fail here instead of after the Rust build. Tauri invokes
          # `codesign -s <identity>` with no --keychain flag.
          echo 'int main(void){return 0;}' | clang -o "$RUNNER_TEMP/signme" -x c -
          codesign --force -s "lgtv-tray-remote-dev" --options runtime "$RUNNER_TEMP/signme"
          codesign --verify --strict "$RUNNER_TEMP/signme"
          rm -f "$p12" "$RUNNER_TEMP/signme"

          # APPLE_CERTIFICATE makes Tauri require an Apple-issued identity
          # (Developer ID Application, Apple Development, ...). This certificate
          # is self-signed, so pass only the identity name.
          echo "APPLE_SIGNING_IDENTITY=lgtv-tray-remote-dev" >> "$GITHUB_ENV"

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo install tauri-cli --locked
          cargo tauri build ${{ matrix.args }}

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: lgtv-tray-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: lgtv-tray-windows
          path: |
            src-tauri/target/release/bundle/nsis/*

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: lgtv-tray-${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig
