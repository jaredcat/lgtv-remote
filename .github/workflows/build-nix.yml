name: Build Nix

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tray:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ensure-release-version moves the tag once ./VERSION matches. Skip until then.
      - name: Require VERSION match on tags
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "VERSION is '${CURRENT:-missing}', tag wants ${VERSION}; ensure-release-version will retag."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into Cargo sources
        if: steps.version.outputs.ready == 'true' && github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json

      - name: Install Nix
        if: steps.version.outputs.ready == 'true'
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        if: steps.version.outputs.ready == 'true' && github.ref_type == 'tag'
        uses: cachix/cachix-action@v17
        with:
          name: lgtv-tray-remote
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build lgtv-tray
        if: steps.version.outputs.ready == 'true'
        run: nix build .#default --print-build-logs
