<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LG TV Remote</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <h1>LG TV Remote</h1>
        <div class="header-right">
          <div class="status">
            <span id="status-dot" class="dot disconnected"></span>
            <span id="status-text">Not Connected</span>
            <button
              type="button"
              id="status-connect-btn"
              class="btn btn-status-connect"
              onclick="connectTv()"
              style="display: none">
              <span class="emoji" aria-hidden="true">🔗</span> Connect
            </button>
          </div>
          <button class="btn-icon quit-btn" onclick="quitApp()" title="Quit">
            <span class="emoji" aria-hidden="true">✕</span>
          </button>
        </div>
      </header>

      <!-- Settings Panel (collapsible) -->
      <section id="settings-panel" class="settings collapsed">
        <button class="settings-toggle" onclick="toggleSettings()">
          <span class="emoji" aria-hidden="true">⚙️</span> Settings
          <span class="arrow">&#x25BC;</span>
        </button>
        <div class="settings-content">
          <div class="field">
            <label for="tv-name">TV Name</label>
            <input type="text" id="tv-name" placeholder="e.g., LivingRoomTV" />
          </div>
          <div class="field">
            <label for="tv-ip">TV IP Address</label>
            <input type="text" id="tv-ip" placeholder="192.168.1.100" />
          </div>
          <div class="field checkbox">
            <label>
              <input type="checkbox" id="use-ssl" checked />
              Use SSL (recommended)
            </label>
          </div>
          <div class="button-row">
            <button class="btn secondary" onclick="authenticate()">
              Authenticate
            </button>
            <button class="btn primary" onclick="connectTv()">Connect</button>
          </div>

          <div class="settings-divider"></div>
          <label class="section-label">Global Shortcut</label>

          <div class="field checkbox">
            <label>
              <input
                type="checkbox"
                id="shortcut-enabled"
                onchange="toggleShortcut()" />
              Enable global shortcut
            </label>
          </div>
          <div class="field shortcut-field">
            <div class="shortcut-input-row">
              <input
                type="text"
                id="shortcut-input"
                placeholder="Click and press keys..."
                readonly />
              <button
                type="button"
                class="btn-clear-shortcut"
                onclick="clearGlobalShortcut()"
                title="Clear shortcut"
                aria-label="Clear shortcut">
                <span class="emoji" aria-hidden="true">✕</span>
              </button>
            </div>
            <small class="hint" id="shortcut-hint"
              >Click to record shortcut</small
            >
          </div>

          <div class="settings-divider"></div>
          <div class="field checkbox">
            <label>
              <input
                type="checkbox"
                id="autostart-enabled"
                onchange="toggleAutostart()" />
              Start with computer
            </label>
          </div>

          <div class="settings-divider"></div>
          <label class="section-label">Wake-on-LAN (MAC Address)</label>

          <div class="field mac-field">
            <input
              type="text"
              id="mac-input"
              placeholder="AA:BB:CC:DD:EE:FF"
              pattern="[0-9A-Fa-f:.\-\s]+" />
            <small class="hint" id="mac-status"></small>
          </div>
          <div class="button-row">
            <button
              class="btn secondary"
              onclick="fetchMac()"
              title="Get MAC from TV (must be connected)">
              Fetch MAC
            </button>
            <button class="btn secondary" onclick="saveMac()">Save MAC</button>
          </div>

          <div class="settings-divider"></div>
          <label class="section-label"
            >Streaming device (e.g. Android TV, Roku)</label
          >
          <small class="hint"
            >Wake your set-top box (Shield, Roku, etc.) when it's in standby so
            you can control it.</small
          >
          <div class="field">
            <label id="streaming-device-type-label">Type</label>
            <div class="type-picker" id="streaming-device-type-picker">
              <input type="hidden" id="streaming-device-type" value="" />
              <button
                type="button"
                class="type-picker-button"
                id="streaming-device-type-button"
                aria-labelledby="streaming-device-type-label"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="streaming-device-type-menu">
                None
              </button>
              <div
                class="type-picker-menu"
                id="streaming-device-type-menu"
                role="listbox"
                hidden>
                <button type="button" role="option" data-value="">None</button>
                <button type="button" role="option" data-value="wol">
                  Wake-on-LAN (Android TV / Shield)
                </button>
                <button type="button" role="option" data-value="adb">
                  ADB (Android TV / Shield)
                </button>
                <button type="button" role="option" data-value="roku">
                  Roku
                </button>
              </div>
            </div>
          </div>
          <div
            id="streaming-device-wol-row"
            class="field"
            style="display: none">
            <label for="streaming-device-mac">Device MAC address</label>
            <input
              type="text"
              id="streaming-device-mac"
              placeholder="AA:BB:CC:DD:EE:FF" />
            <label for="streaming-device-wol-broadcast" class="hint"
              >Subnet broadcast IP (optional, e.g. 10.0.0.255)</label
            >
            <input
              type="text"
              id="streaming-device-wol-broadcast"
              placeholder="10.0.0.255" />
          </div>
          <div
            id="streaming-device-adb-row"
            class="field"
            style="display: none">
            <label for="streaming-device-adb-ip">Device IP address</label>
            <input
              type="text"
              id="streaming-device-adb-ip"
              placeholder="192.168.1.101" />
            <label for="streaming-device-adb-port" class="hint"
              >ADB port (default 5555)</label
            >
            <input
              type="text"
              id="streaming-device-adb-port"
              placeholder="5555" />
          </div>
          <div
            id="streaming-device-roku-row"
            class="field"
            style="display: none">
            <label for="streaming-device-ip">Roku IP address</label>
            <input
              type="text"
              id="streaming-device-ip"
              placeholder="192.168.1.101" />
          </div>
          <div id="streaming-device-wake-on-power-row" class="field checkbox">
            <label>
              <input type="checkbox" id="wake-streaming-on-power-on" />
              Also wake streaming device when using &quot;Power On&quot;
            </label>
          </div>
          <div id="streaming-device-save-row" class="button-row">
            <button class="btn secondary" onclick="saveStreamingDevice()">
              Save streaming device
            </button>
          </div>

          <div id="update-banner" class="update-banner" style="display: none">
            <span id="update-banner-text"></span>
            <button
              type="button"
              class="btn primary btn-install-update"
              onclick="installUpdate()"
              id="btn-install-update">
              Install update
            </button>
          </div>
          <div class="app-version-row">
            <span id="app-version" class="app-version"></span>
            <span id="update-check-wrap">
              <button
                type="button"
                class="btn-link"
                id="btn-check-updates"
                onclick="checkForUpdates()"
                title="Check for app updates">
                Check for updates
              </button>
            </span>
            <span
              id="window-size-dev"
              class="window-size-dev"
              aria-hidden="true"></span>
            <button
              type="button"
              class="btn-link btn-reset-window"
              onclick="resetWindowSize()"
              title="Reset window to default size">
              Reset window size
            </button>
          </div>
        </div>
      </section>

      <!-- Navigation D-Pad -->
      <section class="dpad">
        <div class="dpad-grid">
          <div></div>
          <button class="btn dpad-btn" onclick="sendButton('UP')" title="Up">
            &uarr;
          </button>
          <div></div>
          <button
            class="btn dpad-btn"
            onclick="sendButton('LEFT')"
            title="Left">
            &larr;
          </button>
          <button
            class="btn dpad-btn ok-btn"
            onclick="sendButton('ENTER')"
            title="OK">
            OK
          </button>
          <button
            class="btn dpad-btn"
            onclick="sendButton('RIGHT')"
            title="Right">
            &rarr;
          </button>
          <div></div>
          <button
            class="btn dpad-btn"
            onclick="sendButton('DOWN')"
            title="Down">
            &darr;
          </button>
          <div></div>
        </div>
      </section>
      <section class="media-controls">
        <button
          class="btn dpad-rewind"
          onclick="sendButton('REWIND')"
          title="Rewind">
          <span class="emoji" aria-hidden="true">⏪</span>
        </button>
        <button
          class="btn dpad-pause"
          onclick="sendButton('PAUSE')"
          title="Pause">
          <span class="emoji" aria-hidden="true">⏸️</span>
        </button>
        <button class="btn dpad-play" onclick="sendButton('PLAY')" title="Play">
          <span class="emoji" aria-hidden="true">⏯️</span>
        </button>
        <button class="btn dpad-stop" onclick="sendButton('STOP')" title="Stop">
          <span class="emoji" aria-hidden="true">⏹️</span>
        </button>
        <button
          class="btn dpad-fast-forward"
          onclick="sendButton('FAST_FORWARD')"
          title="Fast Forward">
          <span class="emoji" aria-hidden="true">⏩</span>
        </button>
      </section>

      <!-- Volume Controls -->
      <section class="volume">
        <div class="volume-row">
          <button class="btn" onclick="volumeDown()" title="Volume Down">
            <span class="emoji" aria-hidden="true">🔉</span> Vol
          </button>
          <button class="btn icon-btn" onclick="setMute(true)" title="Mute">
            <span class="emoji" aria-hidden="true">🔇</span>
          </button>
          <button class="btn icon-btn" onclick="setMute(false)" title="Unmute">
            <span class="emoji" aria-hidden="true">🔊</span>
          </button>
          <button class="btn" onclick="volumeUp()" title="Volume Up">
            Vol <span class="emoji" aria-hidden="true">🔊</span>
          </button>
        </div>
        <div class="volume-slider-row">
          <span id="volume-label" class="volume-label" title="Volume">—</span>
          <input
            type="range"
            id="volume-slider"
            class="volume-slider"
            min="0"
            max="100"
            value="0"
            disabled
            oninput="onVolumeSliderInput(this.value)"
            onchange="setVolumeLevel(this.value)"
            title="Volume" />
        </div>
      </section>

      <!-- Quick Actions -->
      <section class="actions">
        <button class="btn action-btn" onclick="powerOn()" title="Power On">
          <span class="emoji" aria-hidden="true">⏻</span> Power On
        </button>
        <button
          class="btn action-btn danger"
          onclick="powerOff()"
          title="Power Off">
          <span class="emoji" aria-hidden="true">⏻</span> Power Off
        </button>
        <button
          class="btn action-btn"
          onclick="sendButton('HOME')"
          title="Home">
          <span class="emoji" aria-hidden="true">🏠</span> Home
        </button>
        <button
          class="btn action-btn"
          onclick="sendButton('BACK')"
          title="Back">
          <span class="emoji" aria-hidden="true">↩️</span> Back
        </button>
        <button
          class="btn action-btn"
          id="wake-streaming-btn"
          onclick="wakeStreamingDevice()"
          title="Wake streaming device (Android TV, Roku)"
          style="display: none">
          <span class="emoji" aria-hidden="true">📺</span> Wake device
        </button>
      </section>

      <!-- Inputs -->
      <section class="inputs-section">
        <label class="section-label">Inputs</label>
        <div id="inputs-list" class="chip-list">
          <span class="hint">Connect to load inputs</span>
        </div>
      </section>

      <!-- Apps (collapsible) -->
      <section id="apps-panel" class="apps-panel collapsed">
        <button class="apps-toggle" type="button" onclick="toggleApps()">
          <span class="emoji" aria-hidden="true">📱</span> Apps
          <span class="arrow">&#x25BC;</span>
        </button>
        <div class="apps-content">
          <div id="apps-list" class="apps-list">
            <span class="hint">Connect to load apps</span>
          </div>
        </div>
      </section>

      <!-- Keyboard Shortcuts (collapsible) -->
      <section id="shortcuts-panel" class="shortcuts-panel collapsed">
        <button
          class="shortcuts-toggle"
          type="button"
          onclick="toggleShortcuts()">
          <span class="emoji" aria-hidden="true">⌨️</span> Keyboard shortcuts
          <span class="arrow">&#x25BC;</span>
        </button>
        <div class="shortcuts-content">
          <small class="hint shortcuts-hint"
            >Click a field and press keys. Check &quot;Global&quot; to use the
            shortcut when the window is closed.</small
          >
          <div id="shortcuts-list" class="shortcuts-list"></div>
        </div>
      </section>
    </div>

    <script src="main.js"></script>
  </body>
</html>
